        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = React.useRef(null);
            
            useEffect(() => {
                if (iconRef.current && lucide.icons[name]) {
                    // Limpiar SVG anterior si existe
                    iconRef.current.innerHTML = '';
                    // Crear nuevo icono
                    const iconNode = lucide.createElement(lucide.icons[name]);
                    
                    // Aplicar atributos
                    iconNode.setAttribute('width', size);
                    iconNode.setAttribute('height', size);
                    
                    // Manejar las clases (Tailwind) pasándolas directamente al SVG
                    if (className) {
                        const classes = className.split(' ');
                        classes.forEach(c => {
                            if(c) iconNode.classList.add(c);
                        });
                    }
                    
                    iconRef.current.appendChild(iconNode);
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

            ]
          },
          {
            date: "08/09/2026",
            activities: [
              { id: "08-1", time: "09:30", city: "TOKYO", title: "Paseo por Kagurazaka", location: "Kagurazaka", cost: "$0", type: "Camera" },
              { id: "08-2", time: "10:30", city: "TOKYO", title: "Cafetería tradicional", location: "Kagurazaka", cost: "$8.000", type: "Coffee" },
              { id: "08-3", time: "11:30", city: "TOKYO", title: "Callejones históricos y templos", location: "Kagurazaka", cost: "$0", type: "Camera" },
              { id: "08-4", time: "13:00", city: "TOKYO", title: "Almuerzo", location: "Kagurazaka", cost: "$18.000", type: "Utensils" },
              { id: "08-5", time: "14:30", city: "YOKOHAMA", title: "Traslado a Yokohama", location: "JR Line", cost: "$0", type: "Train" },
              { id: "08-6", time: "15:30", city: "YOKOHAMA", title: "Red Brick Warehouse", location: "Minato Mirai", cost: "$0", type: "Camera" },
              { id: "08-7", time: "17:00", city: "YOKOHAMA", title: "Paseo por Osanbashi Pier", location: "Minato Mirai", cost: "$0", type: "Camera" },
              { id: "08-8", time: "18:15", city: "YOKOHAMA", title: "Atardecer frente a la bahía", location: "Minato Mirai", cost: "$0", type: "Camera" },
              { id: "08-9", time: "19:00", city: "YOKOHAMA", title: "Noria Cosmo Clock 21", location: "Cosmo World", cost: "$6.000", type: "Camera" },
              { id: "08-10", time: "20:00", city: "YOKOHAMA", title: "Cena", location: "Yokohama Chinatown", cost: "$22.000", type: "Utensils" },
              { id: "08-11", time: "22:00", city: "TOKYO", title: "Regreso al hotel", location: "Shimbashi", cost: "$3.000", type: "Train" }
            ]
          },
          {
            date: "09/09/2026",
            activities: [
              { id: "09-1", time: "09:30", city: "TOKYO", title: "Paseo por Azabudai Hills", location: "Azabudai Hills", cost: "$0", type: "Camera" },
              { id: "09-2", time: "11:00", city: "TOKYO", title: "Visita al templo Zojo-ji", location: "Zojo-ji", cost: "$0", type: "Camera" },
              { id: "09-3", time: "13:00", city: "TOKYO", title: "Almuerzo", location: "Roppongi", cost: "$20.000", type: "Utensils" },
              { id: "09-4", time: "14:30", city: "TOKYO", title: "Mirador", location: "Tokyo City View", cost: "$15.000", type: "Camera" },
              { id: "09-5", time: "16:45", city: "TOKYO", title: "Paseo por Shibuya", location: "Shibuya", cost: "$0", type: "Camera" },
              { id: "09-6", time: "17:45", city: "TOKYO", title: "Atardecer desde Shibuya Sky", location: "Shibuya Sky", cost: "$18.000", type: "Camera" },
              { id: "09-7", time: "20:00", city: "TOKYO", title: "Cena de despedida", location: "Shibuya", cost: "$25.000", type: "Utensils" }
            ]
          }
        ];

        // Helper function for icon colors
        const getIconColorClass = (type) => {
            switch (type) {
                case 'Plane': return "text-blue-500";
                case 'Train': return "text-orange-500";
                case 'Utensils': return "text-red-500";
                case 'Coffee': return "text-amber-600";
                case 'ShoppingBag': return "text-purple-500";
                case 'Hotel': return "text-indigo-500";
                case 'MapPin': return "text-gray-500";
                default: return "text-emerald-500";
            }
        };

        function App() {
            // Cargar estado inicial desde localStorage si existe
            const [checkedItems, setCheckedItems] = useState(() => {
                const saved = localStorage.getItem('itineraryProgress');
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        return {};
                    }
                }
                return {};
            });

            // Guardar en localStorage cada vez que cambie
            useEffect(() => {
                localStorage.setItem('itineraryProgress', JSON.stringify(checkedItems));
            }, [checkedItems]);

            const toggleCheck = (id) => {
                setCheckedItems(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            const totalActivities = useMemo(() => 
                itineraryData.reduce((acc, day) => acc + day.activities.length, 0)
            , []);
            
            const completedCount = Object.values(checkedItems).filter(Boolean).length;
            const progressPercentage = Math.round((completedCount / totalActivities) * 100);

            return (
                <div className="min-h-screen pb-20 font-sans text-slate-800">
                    
                    {/* Header Fijo */}
                    <header className="sticky top-0 z-50 bg-white/80 backdrop-blur-md shadow-sm px-4 py-4">
                        <div className="max-w-3xl mx-auto flex flex-col gap-3">
                            <div className="flex justify-between items-center">
                                <h1 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                                    <Icon name="plane" size={24} className="text-indigo-600" /> 
                                    Viaje a Asia 2026
                                </h1>
                                <span className="text-sm font-semibold bg-indigo-100 text-indigo-700 py-1 px-3 rounded-full">
                                    {completedCount} / {totalActivities}
                                </span>
                            </div>
                            
                            <div className="w-full bg-slate-200 rounded-full h-2.5">
                                <div 
                                    className="bg-indigo-600 h-2.5 rounded-full transition-all duration-500 ease-out" 
                                    style={{ width: `${progressPercentage}%` }}
                                ></div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-3xl mx-auto p-4 space-y-6">
                        {itineraryData.map((day) => {
                            const isCompleted = day.activities.every(act => checkedItems[act.id]);
                            const completedDayCount = day.activities.filter(act => checkedItems[act.id]).length;
                            
                            return (
                                <div key={day.date} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    
                                    <div className={`bg-slate-800 text-white p-4 flex justify-between items-center ${isCompleted ? 'opacity-70' : ''}`}>
                                        <div className="flex items-center gap-3">
                                            <Icon name="calendar-days" size={20} className={isCompleted ? 'text-indigo-300' : 'text-indigo-400'} />
                                            <h2 className="font-bold text-lg">{day.date}</h2>
                                        </div>
                                        <div className="text-sm bg-white/20 px-2 py-1 rounded-md font-medium">
                                            {completedDayCount}/{day.activities.length}
                                        </div>
                                    </div>

                                    <div className="divide-y divide-slate-100">
                                        {day.activities.map((activity) => {
                                            const isChecked = checkedItems[activity.id];
                                            return (
                                                <div 
                                                    key={activity.id}
                                                    onClick={() => toggleCheck(activity.id)}
                                                    className={`p-4 flex gap-4 cursor-pointer transition-all active:scale-[0.99] hover:bg-slate-50
                                                        ${isChecked ? 'opacity-50 bg-slate-50' : 'bg-white'}`}
                                                >
                                                    <div className="flex-shrink-0 mt-1">
                                                        {isChecked ? (
                                                            <Icon name="check-circle-2" size={26} className="text-indigo-500" />
                                                        ) : (
                                                            <Icon name="circle" size={26} className="text-slate-300" />
                                                        )}
                                                    </div>
                                                    
                                                    <div className="flex-1 space-y-1">
                                                        <div className="flex justify-between items-start">
                                                            <h3 className={`font-semibold text-base ${isChecked ? 'line-through text-slate-500' : 'text-slate-900'}`}>
                                                                {activity.title}
                                                            </h3>
                                                            <span className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded">
                                                                {activity.time}
                                                            </span>
                                                        </div>
                                                        
                                                        <div className="flex flex-wrap gap-x-4 gap-y-2 text-sm text-slate-500 mt-2">
                                                            <div className="flex items-center gap-1.5">
                                                                {/* Map string like 'Plane' to lucide name like 'plane' */}
                                                                <Icon 
                                                                    name={activity.type.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase()} 
                                                                    size={16} 
                                                                    className={getIconColorClass(activity.type)} 
                                                                />
                                                                <span>{activity.location}</span>
                                                            </div>
                                                            <div className="flex items-center gap-1.5">
                                                                <Icon name="map-pin" size={16} className="text-slate-400" />
                                                                <span>{activity.city}</span>
                                                            </div>
                                                            {activity.cost !== "$0" && activity.cost !== "$O" && (
                                                                <div className="flex items-center gap-1.5 font-medium text-slate-600">
                                                                    <Icon name="credit-card" size={16} className="text-slate-400" />
                                                                    <span>{activity.cost}</span>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </main>
                </div>
            );
        }

        // Renderizar la app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
