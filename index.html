                ]
            }
        ];

        
        // Función para obtener el color del icono basado en el tipo
        function getIconColorClass(type) {
            const map = {
                'Plane': 'text-asia-indigo',
                'Train': 'text-asia-indigo opacity-80',
                'Utensils': 'text-asia-red',
                'Coffee': 'text-yellow-700',
                'ShoppingBag': 'text-purple-700',
                'Hotel': 'text-teal-700',
                'MapPin': 'text-gray-500',
                'Camera': 'text-asia-gold'
            };
            return map[type] || 'text-gray-500';
        }

        // Función para traducir el nombre del ícono a Lucide icon name
        function getLucideIconName(type) {
            const map = {
                'Plane': 'plane',
                'Train': 'train',
                'Utensils': 'utensils',
                'Coffee': 'coffee',
                'ShoppingBag': 'shopping-bag',
                'Hotel': 'hotel',
                'MapPin': 'map-pin',
                'Camera': 'camera'
            };
            return map[type] || 'circle';
        }

        // Variables de estado
        let checkedItems = JSON.parse(localStorage.getItem('asiaTripChecked2026')) || {};
        let totalActivities = 0;

        // Calcular total de actividades
        itineraryData.forEach(day => {
            totalActivities += day.activities.length;
        });

        function renderApp() {
            const container = document.getElementById('itinerary-container');
            container.innerHTML = ''; // Limpiar contenedor

            itineraryData.forEach((day, dayIndex) => {
                // Comprobar estado del día
                const isDayCompleted = day.activities.every(act => checkedItems[act.id]);
                const completedDayCount = day.activities.filter(act => checkedItems[act.id]).length;

                // Crear elemento del día (Tarjeta)
                const dayDiv = document.createElement('div');
                dayDiv.className = `bg-asia-paper rounded-xl card-shadow border border-[#e0dbd5] overflow-hidden relative mb-6 md:mb-8 transition-opacity ${isDayCompleted ? 'opacity-80' : ''}`;
                
                // HTML interno de la tarjeta (Cabecera)
                let dayHTML = `
                    <div class="h-1 w-full bg-asia-red absolute top-0 left-0 right-0"></div>
                    <div class="bg-asia-indigo text-asia-paper p-4 md:p-5 flex justify-between items-center ${isDayCompleted ? 'bg-gray-800' : ''}">
                        <div class="flex items-center gap-2 md:gap-3">
                            <i data-lucide="calendar" class="w-5 h-5 md:w-6 md:h-6 ${isDayCompleted ? 'text-gray-400' : 'text-asia-gold'}"></i>
                            <h2 class="font-serif font-bold text-lg md:text-xl tracking-wide">${day.date}</h2>
                        </div>
                        <div class="text-xs md:text-sm bg-black/30 text-asia-gold px-2 md:px-3 py-1 rounded border border-asia-gold/30 font-medium tracking-widest">
                            ${completedDayCount}/${day.activities.length}
                        </div>
                    </div>
                    <div class="divide-y divide-[#e0dbd5]">
                `;

                // Añadir cada actividad
                day.activities.forEach(activity => {
                    const isChecked = checkedItems[activity.id];
                    const iconColor = getIconColorClass(activity.type);
                    const iconName = getLucideIconName(activity.type);
                    
                    dayHTML += `
                        <div onclick="toggleCheck('${activity.id}')" class="activity-item p-4 md:p-5 flex gap-3 md:gap-4 cursor-pointer hover:bg-[#faf8f5] ${isChecked ? 'checked-item' : 'bg-asia-paper'}">
                            
                            <div class="flex-shrink-0 mt-1">
                                ${isChecked 
                                    ? '<i data-lucide="check-circle-2" class="text-asia-red w-6 h-6 md:w-7 md:h-7"></i>' 
                                    : '<i data-lucide="circle" class="text-gray-300 w-6 h-6 md:w-7 md:h-7"></i>'}
                            </div>
                            
                            <div class="flex-1 space-y-1 md:space-y-2">
                                <div class="flex justify-between items-start gap-2">
                                    <h3 class="font-serif font-bold text-base md:text-lg leading-tight ${isChecked ? '' : 'text-asia-ink'}">
                                        ${activity.title}
                                    </h3>
                                    <span class="text-[10px] md:text-xs font-bold text-asia-indigo bg-[#e8eaf6] px-1.5 py-1 rounded shadow-sm shrink-0">
                                        ${activity.time}
                                    </span>
                                </div>
                                
                                <div class="flex flex-wrap gap-x-4 gap-y-1.5 text-xs md:text-sm text-gray-600 mt-2">
                                    <div class="flex items-center gap-1 font-medium">
                                        <i data-lucide="${iconName}" class="${iconColor} w-3.5 h-3.5 md:w-4 md:h-4"></i>
                                        <span class="text-gray-800 line-clamp-1">${activity.location}</span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <i data-lucide="map-pin" class="text-gray-400 w-3.5 h-3.5 md:w-4 md:h-4"></i>
                                        <span class="uppercase tracking-wider text-[10px] md:text-[11px] font-bold text-gray-500">${activity.city}</span>
                                    </div>
                                    ${activity.cost !== "$0" && activity.cost !== "$O" ? `
                                        <div class="flex items-center gap-1 font-semibold text-asia-red/80 bg-red-50 px-1.5 py-0.5 rounded">
                                            <i data-lucide="wallet" class="text-asia-red/60 w-3 h-3 md:w-3.5 md:h-3.5"></i>
                                            <span>${activity.cost}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });

                dayHTML += `</div>`;
                dayDiv.innerHTML = dayHTML;
                container.appendChild(dayDiv);
            });

            // Actualizar iconos de Lucide
            lucide.createIcons();
            
            // Actualizar estadísticas
            updateStats();
        }

        function toggleCheck(id) {
            if (checkedItems[id]) {
                delete checkedItems[id];
            } else {
                checkedItems[id] = true;
            }
            
            // Guardar en el dispositivo
            localStorage.setItem('asiaTripChecked2026', JSON.stringify(checkedItems));
            
            // Re-renderizar la vista
            renderApp();
        }

        function updateStats() {
            const completedCount = Object.keys(checkedItems).length;
            const progressPercentage = Math.round((completedCount / totalActivities) * 100) || 0;

            document.getElementById('progress-text').innerText = `${completedCount} / ${totalActivities}`;
            document.getElementById('progress-bar').style.width = `${progressPercentage}%`;
        }
        
        // Botón de reset (limpiar datos)
        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm('¿Seguro que quieres desmarcar todas las actividades?')) {
                checkedItems = {};
                localStorage.setItem('asiaTripChecked2026', JSON.stringify(checkedItems));
                renderApp();
            }
        });

        // Inicializar aplicación
        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });

    </script>
