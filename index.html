<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Itinerario privado, gastos, estadías y documentos para Asia 2026.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' data: blob: https://*.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests">
  <title>Asia 2026 · Mi viaje</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/styles.css?v=33">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#today" aria-label="Asia 2026, inicio">
        <img src="./app-icon-v2.png" width="32" height="32" alt="">
        <span>Asia <strong>2026</strong></span>
      </a>
      <div class="header-actions">
        <button id="sync-button" class="status-button" type="button" aria-label="Cuenta y sincronización">
          <span id="sync-dot" class="status-dot" aria-hidden="true"></span>
          <span id="sync-label">Solo local</span>
        </button>
        <div id="progress-pill" class="progress-pill" aria-live="polite">0%</div>
        <button id="more-button" class="icon-button" type="button" aria-expanded="false" aria-controls="tools-panel">
          <span aria-hidden="true">•••</span><span class="sr-only">Abrir herramientas</span>
        </button>
      </div>
    </div>
  </header>

  <div id="connection-banner" class="connection-banner" role="status" aria-live="polite" hidden></div>

  <section id="tools-panel" class="tools-panel" aria-label="Herramientas del viaje" hidden>
    <div class="tools-inner">
      <div class="clock-grid" aria-label="Horas del viaje">
        <div><span>Santiago</span><strong id="clock-santiago">--:--</strong></div>
        <div><span>Shanghái</span><strong id="clock-shanghai">--:--</strong></div>
        <div><span>Tokio</span><strong id="clock-tokyo">--:--</strong></div>
      </div>
      <div id="quick-actions" class="quick-actions"></div>
      <div class="backup-row">
        <p id="backup-status">Tus cambios se guardan automáticamente en este dispositivo.</p>
        <span class="build-version" aria-label="Versión de la vista">Vista v33</span>
        <div>
          <button type="button" class="text-button" data-action="export">Exportar respaldo</button>
          <button type="button" class="text-button" data-action="import">Importar</button>
          <input id="import-file" type="file" accept=".asia-backup,.json,application/json" hidden>
        </div>
      </div>
    </div>
  </section>

  <main id="main-content" class="page-shell">
    <section id="today" class="today-column" aria-labelledby="today-title"></section>

    <aside id="desktop-summary" class="desktop-summary" aria-label="Resumen del viaje"></aside>

    <section id="itinerary" class="itinerary-section" aria-labelledby="itinerary-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Plan de viaje</p>
          <h1 id="itinerary-title">Itinerario</h1>
        </div>
        <button type="button" class="primary-button" data-action="add-activity">Agregar evento</button>
      </div>
      <div class="filter-bar">
        <label class="search-field">
          <span class="sr-only">Buscar actividad</span>
          <input id="search-input" type="search" placeholder="Buscar lugar o actividad…" autocomplete="off">
        </label>
        <label>
          <span class="sr-only">Filtrar por ciudad</span>
          <select id="city-filter"><option value="ALL">Todas las ciudades</option></select>
        </label>
        <label>
          <span class="sr-only">Filtrar por tipo</span>
          <select id="type-filter"><option value="ALL">Todos los tipos</option></select>
        </label>
      </div>
      <div id="filter-summary" class="filter-summary" aria-live="polite"></div>
      <div id="itinerary-list" class="itinerary-list"></div>
    </section>
  </main>

  <nav class="mobile-nav" aria-label="Navegación principal">
    <button type="button" data-nav="today" class="is-active"><span aria-hidden="true">✦</span>Hoy</button>
    <button type="button" data-nav="itinerary"><span aria-hidden="true">≡</span>Itinerario</button>
    <button type="button" data-action="budget"><span aria-hidden="true">$</span>Gastos</button>
    <button type="button" data-action="more"><span aria-hidden="true">•••</span>Más</button>
  </nav>

  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
    <div class="dialog-surface">
      <header class="dialog-header">
        <div><p id="dialog-eyebrow" class="eyebrow"></p><h2 id="dialog-title"></h2></div>
        <button id="dialog-close" class="icon-button" type="button" aria-label="Cerrar ventana">×</button>
      </header>
      <div id="dialog-content" class="dialog-content"></div>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="./config.js"></script>
  <script src="./assets/app.js?v=33" defer></script>
</body>
</html>
