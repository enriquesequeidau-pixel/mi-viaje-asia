<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Asia 2026</title>
  <desc id="desc">Una brújula dorada con una ruta de avión sobre un fondo rojo.</desc>
  <defs>
    <linearGradient id="background" x1="56" y1="40" x2="456" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d53935"/>
      <stop offset="1" stop-color="#8f1724"/>
    </linearGradient>
    <linearGradient id="gold" x1="180" y1="132" x2="336" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6dc77"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#b7841d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5e1019" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Fondo completo para que el icono siga viéndose bien en máscaras circulares. -->
  <rect width="512" height="512" rx="128" fill="url(#background)"/>
  <circle cx="256" cy="256" r="194" fill="#fdfbf7" opacity=".16"/>
  <circle cx="256" cy="256" r="168" fill="#fdfbf7" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="148" fill="#1a237e"/>

  <!-- Ruta del viaje -->
  <path d="M131 326c29 45 78 74 133 74 76 0 138-54 151-126" fill="none" stroke="#d4af37" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 23"/>
  <path d="M390 261c21 3 38 19 43 40-16-2-33-8-46-19l-26 6-8-9 22-12 2-27 11-4z" fill="#d4af37"/>
  <circle cx="130" cy="326" r="10" fill="#d4af37"/>

  <!-- Rosa de los vientos -->
  <g filter="url(#shadow)">
    <path d="M256 105l29 117 122 34-122 34-29 117-29-117-122-34 122-34z" fill="url(#gold)"/>
    <path d="M256 143l19 94 94 19-94 19-19 94-19-94-94-19 94-19z" fill="#fdfbf7"/>
    <path d="M256 163l19 93 93-19-93 38-19 93-19-93-93-19 93-19z" fill="#c62828"/>
    <circle cx="256" cy="256" r="39" fill="#1a237e" stroke="#fdfbf7" stroke-width="8"/>
    <path d="M256 221l16 35-16 35-16-35z" fill="url(#gold)"/>
    <circle cx="256" cy="256" r="8" fill="#fdfbf7"/>
  </g>

  <!-- Pequeño sol, para dar calidez y profundidad al emblema. -->
  <circle cx="152" cy="166" r="18" fill="#d4af37"/>
</svg>
